<div class="slqs-field {% if field.errors %}slqs-has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="slqs-required" aria-label="required"> *</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<small class="slqs-help">{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<small class="slqs-error">{{ error }}</small>{% endfor %}
</div>
